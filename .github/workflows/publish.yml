name: Publish crate

on:
  workflow_dispatch:
    inputs:
      package:
        description: Crate to publish
        required: true
        type: choice
        options:
          - xuan-cosmology
          - xuan-calendar
      version:
        description: Version expected in the crate manifest
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: write

concurrency:
  group: publish-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      PACKAGE: ${{ inputs.package }}
      VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate release input
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CARGO_REGISTRY_TOKEN}" ]]; then
            echo "::error::Repository secret CARGO_REGISTRY_TOKEN is not configured"
            exit 1
          fi

          manifest="crates/${PACKAGE}/Cargo.toml"
          actual_version="$(awk -F'"' '/^version = "/ { print $2; exit }' "${manifest}")"
          if [[ "${actual_version}" != "${VERSION}" ]]; then
            echo "::error::${PACKAGE} manifest version is ${actual_version}, expected ${VERSION}"
            exit 1
          fi

          tag="${PACKAGE}-v${VERSION}"
          if git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists"
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Verify package
        run: cargo publish --dry-run -p "${PACKAGE}"

      - name: Publish to crates.io
        run: cargo publish -p "${PACKAGE}"

      - name: Tag release
        shell: bash
        run: |
          set -euo pipefail
          tag="${PACKAGE}-v${VERSION}"
          git config user.name "phucrio"
          git config user.email "bphuc682@gmail.com"
          git tag -a "${tag}" -m "${tag}"
          git push origin "${tag}"
