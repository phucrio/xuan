name: Publish crates

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish.yml"
      - "crates/*/Cargo.toml"
      - "crates/*/CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-crates
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate release credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN}" ]]; then
            echo "::error::Repository secret CARGO_REGISTRY_TOKEN is not configured"
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Publish crates and create GitHub releases
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "phucrio"
          git config user.email "bphuc682@gmail.com"

          crate_version() {
            local package="$1"
            awk -F'"' '/^version = "/ { print $2; exit }' "crates/${package}/Cargo.toml"
          }

          ensure_github_release() {
            local package="$1"
            local version="$2"
            local tag="${package}-v${version}"

            if gh release view "${tag}" >/dev/null 2>&1; then
              echo "GitHub release ${tag} already exists"
              return 0
            fi

            gh release create "${tag}" \
              --verify-tag \
              --title "${package} v${version}" \
              --notes-file "crates/${package}/CHANGELOG.md"
          }

          release_package() {
            local package="$1"
            local version
            local tag

            version="$(crate_version "${package}")"
            tag="${package}-v${version}"

            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "Tag ${tag} already exists; skipping crates.io publish"
              ensure_github_release "${package}" "${version}"
              return 0
            fi

            cargo publish --dry-run -p "${package}"
            cargo publish -p "${package}"

            git tag -a "${tag}" -m "${tag}"
            git push origin "${tag}"
            ensure_github_release "${package}" "${version}"
          }

          sparse_index_path() {
            local package="${1,,}"
            local length="${#package}"

            case "${length}" in
              1) printf '1/%s' "${package}" ;;
              2) printf '2/%s' "${package}" ;;
              3) printf '3/%s/%s' "${package:0:1}" "${package}" ;;
              *) printf '%s/%s/%s' "${package:0:2}" "${package:2:2}" "${package}" ;;
            esac
          }

          wait_for_registry_version() {
            local package="$1"
            local version="$2"
            local index_path
            local index_url

            index_path="$(sparse_index_path "${package}")"
            index_url="https://index.crates.io/${index_path}"

            for attempt in {1..30}; do
              if curl --fail --silent --show-error --location \
                --header 'Cache-Control: no-cache' \
                "${index_url}" | grep -F "\"vers\":\"${version}\"" >/dev/null; then
                echo "${package} ${version} is visible in the crates.io sparse index"
                return 0
              fi

              echo "Waiting for ${package} ${version} in the crates.io sparse index (${attempt}/30)"
              sleep 10
            done

            echo "::error::${package} ${version} did not become visible in the crates.io sparse index in time"
            return 1
          }

          release_package "xuan-cosmology"
          wait_for_registry_version "xuan-cosmology" "$(crate_version xuan-cosmology)"
          release_package "xuan-calendar"
