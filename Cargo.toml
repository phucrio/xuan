[workspace]
resolver = "3"
members = [
    "crates/xuan-cosmology",
    "crates/xuan-calendar",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/phucrio/xuan"
authors = ["phucrio <bphuc682@gmail.com>"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
